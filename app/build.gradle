plugins {
    id 'com.android.application'
    id 'kotlin-android'  // 必选：启用 Kotlin Android 支持
}

android {
    compileSdkVersion 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.hss01248.mypermissiondemo"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug{

        }
    }
    buildTypes {
        debug{
            debuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    maven { url 'https://cdn.jsdelivr.net/gh/link-u/AndroidGlideAvifDecoder@master/repository' }
}

dependencies {
    api 'com.hss01248.utilcodeEnhanceX:baseWebview:2.2.49.29'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation project(path: ':permission')
    implementation project(path: ':location')
    implementation project(path: ':ext')
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    //https://github.com/yayaa/LocationManager
    implementation 'com.yayandroid:LocationManager:2.4.1'
    api "com.github.hss01248.AndoridBus:bus:2.0.3"
    api 'com.hss01248.utilcodeEnhanceX:baseWebview:2.2.49.29'
    //implementation "com.google.android:flexbox:0.3.1"
}
configurations {
    all*.exclude group: 'com.github.simplepeng.SpiderMan', module: 'spiderman'
    all*.exclude group: 'com.github.hss01248.utilcodeEnhance'
    all*.exclude group: 'com.github.hss01248.MyPermission'
    //com.github.hss01248.metadata
    all*.exclude group: 'com.github.hss01248.metadata'
    //all*.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    all*.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    all*.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    //org.jetbrains.kotlin:kotlin-stdlib
    all {
        resolutionStrategy {
            force "androidx.appcompat:appcompat:1.2.0"
            force "com.google.android.material:material:1.2.0"
        }
    }
}
